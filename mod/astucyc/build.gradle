plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.3'
}

version = project.mod_version
group = 'com.astucy'

base {
    archivesName = 'astucyc'
}

repositories {
    mavenCentral()
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly files("${System.getenv('APPDATA')}/.minecraft/libraries/net/fabricmc/sponge-mixin/0.17.4+mixin.0.8.7/sponge-mixin-0.17.4+mixin.0.8.7.jar")
    // só para compilar a tela de config do Mod Menu; em runtime é opcional
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
}
