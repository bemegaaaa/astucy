[package]
name = "launcher"
version = "0.1.0"
description = "Astucy Launcher"
authors = ["Astucy"]
edition = "2024"
autobins = false
default-run = "launcher"

[[bin]]
name = "launcher"
path = "src/bin/native.rs"

[[bin]]
name = "launcher-webview"
path = "src/main.rs"

[lib]
name = "launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
sha1 = "0.10"
md-5 = "0.10"
png = "0.17"
image-webp = "0.2"
# natives de versões antigas (1.7.10) vêm dentro de jars e precisam ser extraídos
zip = { version = "2", default-features = false, features = ["deflate"] }
# UI nativa do launcher (sem WebView2)
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_SystemInformation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
